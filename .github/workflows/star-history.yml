name: Star history

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/star-history.yml
      - scripts/update_star_history.py
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: star-history

jobs:
  update:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Update star chart from the GitHub repository count
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_star_history.py
      - name: Commit changed counts
        run: |
          git add assets/star-history.json assets/star-history.svg
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: update star history'
          git push
